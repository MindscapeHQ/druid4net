trigger:
  branches:
    include:
    - '*'

pool:
  vmImage: 'windows-latest'

variables:
  buildConfiguration: 'Release'

steps:
- task: UseDotNet@2
  displayName: Install .NET SDK
  inputs:
    packageType: sdk
    useGlobalJson: true

- script: dotnet restore Raygun.Druid4Net.sln
  displayName: Restore

- script: dotnet build Raygun.Druid4Net.sln --configuration $(buildConfiguration) --no-restore
  displayName: Build

- script: dotnet test Raygun.Druid4Net.Tests/Raygun.Druid4Net.Tests.csproj --configuration $(buildConfiguration) --no-build --no-restore --logger "trx;LogFileName=unit-tests.trx" --results-directory "$(Agent.TempDirectory)/TestResults"
  displayName: Run unit tests

- pwsh: |
    $result = Get-ChildItem "$(Agent.TempDirectory)/TestResults" -Filter unit-tests.trx -Recurse | Select-Object -First 1
    if ($null -eq $result) {
      throw "Unit test result file was not created."
    }

    [xml] $trx = Get-Content $result.FullName
    $testCount = [int] $trx.TestRun.ResultSummary.Counters.total
    if ($testCount -lt 1) {
      throw "No unit tests were discovered."
    }

    Write-Host "Verified $testCount discovered unit tests."
  displayName: Verify unit test discovery

- task: PublishTestResults@2
  displayName: Publish unit test results
  condition: succeededOrFailed()
  inputs:
    testResultsFormat: VSTest
    testResultsFiles: '$(Agent.TempDirectory)/TestResults/*.trx'
    testRunTitle: Druid4Net unit tests (.NET 10)

- script: dotnet pack Raygun.Druid4Net/Raygun.Druid4Net.csproj --configuration $(buildConfiguration) --no-build --no-restore --output "$(Build.ArtifactStagingDirectory)"
  displayName: Pack
